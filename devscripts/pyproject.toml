[project]
name = "toolserver"
version = "0.1.0"
description = "Host-side tool server for the jiminy-snippet Claude Code sandbox"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
toolserver = "toolserver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolserver"]
